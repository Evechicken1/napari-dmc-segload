[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-dmc-segload"
version = "0.1.0"
description = "Channel-aware segmentation image loader for DMC-BrainMap"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "napari",
    "numpy",
    "pandas",
    "natsort",
    "magicgui",
    "qtpy",
    "tifffile",
    "zarr",
    "aicspylibczi",
]

[project.optional-dependencies]
testing = ["pytest", "pytest-qt"]

[project.entry-points."napari.manifest"]
napari-dmc-segload = "napari_dmc_segload:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
napari_dmc_segload = ["napari.yaml"]
